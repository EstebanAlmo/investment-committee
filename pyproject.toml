[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-committee"
version = "0.1.0"
description = "Personal multi-agent investment analysis system for stocks and ETFs."
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = { text = "Proprietary" }
authors = [{ name = "Esteban Almo" }]

# Intentionally minimal. Additional LLM and storage dependencies will be
# added as each layer is implemented.
dependencies = [
    "yfinance>=0.2.40",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0",
    # LLM provider HTTP calls (integrations/llm); already installed with python-telegram-bot.
    "httpx>=0.27",
    # Time-zone database for zoneinfo (New York sessions): Windows has none of
    # its own, and the same data on Windows and macOS keeps the results equal.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Local trade viewer (interfaces/trade_viewer): charts and dashboard only.
# The engine, the backtest and their tests run without it.
viewer = [
    "plotly>=7.1",
    "kaleido>=1.5",
    "streamlit>=1.67",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
